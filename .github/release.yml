changelog:
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation and maintenance
      labels:
        - documentation
        - maintenance
    - title: Other changes
      labels:
        - "*"
  exclude:
    labels:
      - skip-changelog
    authors:
      - github-actions[bot]
